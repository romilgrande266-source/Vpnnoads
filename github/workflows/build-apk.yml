name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Kung zip ang inupload mo (AdBlockVpn.zip), i-extract muna
      - name: Unzip project kung zip ang inupload
        run: |
          if [ -f AdBlockVpn.zip ]; then unzip -q -o AdBlockVpn.zip; fi

      - name: Build debug APK
        run: |
          if [ -d AdBlockVpn ]; then cd AdBlockVpn; fi
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/outputs/apk/debug/app-debug.apk"
